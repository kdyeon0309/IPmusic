name: IpMusic

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

schemes:
  IpMusic:
    build:
      targets:
        IpMusic: all
    run:
      config: Debug

targets:
  IpMusic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: IpMusic
      - path: Shared
    info:
      path: IpMusic/Info.plist
      properties:
        CFBundleDisplayName: IpMusic
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSSupportsLiveActivities: true
        NSAppleMusicUsageDescription: "친구에게 보여줄 내 재생 중인 곡을 감지하기 위해 필요합니다."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kdyeon.ipmusic
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L53AMDAR4M
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: IpMusicWidget
        embed: true

  IpMusicWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: IpMusicWidget
      - path: Shared
    info:
      path: IpMusicWidget/Info.plist
      properties:
        CFBundleDisplayName: IpMusicWidget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kdyeon.ipmusic.widget
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L53AMDAR4M
