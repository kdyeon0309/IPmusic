services:
  db:
    image: postgres:16
    container_name: ipmusic-db
    environment:
      POSTGRES_USER: ipmusic
      POSTGRES_PASSWORD: ipmusic
      POSTGRES_DB: ipmusic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipmusic"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
